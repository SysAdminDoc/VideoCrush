[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videocrush"
version = "0.1.0"
description = "FFmpeg-powered desktop and command-line video compressor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SysAdminDoc" }]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]

[project.scripts]
videocrush = "videocrush_cli:main"

[tool.setuptools]
py-modules = ["videocrush_core", "videocrush_cli"]

[tool.ruff]
line-length = 120
target-version = "py38"
